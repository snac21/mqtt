syntax = "proto3";

package mqtt;

option go_package = "gitee.com/snac21/mqtt/proto";

// MessageType defines the type of MQTT message
enum MessageType {
  UNKNOWN = 0;
  AUTH = 1;
  DATA = 2;
  CONTROL = 3;
  STATUS = 4;
}

// Message represents a generic MQTT message
message Message {
  MessageType type = 1;
  string topic = 2;
  bytes payload = 3;
  int32 qos = 4;
  bool retain = 5;
  map<string, string> metadata = 6;
}

// AuthMessage represents an authentication message
message AuthMessage {
  string username = 1;
  string password = 2;
  string client_id = 3;
  bool success = 4;
}

// DataMessage represents a data message
message DataMessage {
  string device_id = 1;
  bytes data = 2;
  int64 timestamp = 3;
}

// ControlMessage represents a control message
message ControlMessage {
  string command = 1;
  map<string, string> parameters = 2;
}

// StatusMessage represents a status message
message StatusMessage {
  string device_id = 1;
  string status = 2;
  int64 timestamp = 3;
  map<string, string> metrics = 4;
} 